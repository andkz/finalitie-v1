  <style>

        /* Framer Exact Section Badges - Unified Silver Metallic Capsule Aesthetic */
    .badge-section {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
      letter-spacing: -0.01em;
      background: linear-gradient(180deg, #ffffff 0%, #fafafa 45%, #f4f4f5 100%) !important;
      border: 1px solid rgba(228, 228, 231, 0.95) !important;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 1) !important;
      color: #09090b !important;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .badge-section:hover {
      border-color: #d4d4d8 !important;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 1) !important;
      background: linear-gradient(180deg, #ffffff 0%, #f4f4f5 45%, #ececee 100%) !important;
    }
    .badge-section-solid,
    .badge-section-gradient {
      color: #09090b !important;
      font-weight: 600 !important;
      letter-spacing: -0.01em !important;
      display: inline-block !important;
      background: none !important;
      -webkit-text-fill-color: #09090b !important;
    });

      document.querySelectorAll('.mobile-nav-link').forEach((link) => {
        link.addEventListener('click', () => {
          mobileMenu.classList.add('hidden');
          hamburgerIcon.classList.remove('hidden');
          closeIcon.classList.add('hidden');
        });
      });
    }

    // Category Filtering & Sanity Loader
    const categoryPills = document.querySelectorAll('.category-pill');
    const container = document.getElementById('articles-container');

    async function updateArticles(cat = 'all') {
      if (window.sanityClient && window.sanityClient.isConfigured()) {
        const posts = await window.sanityClient.getAllPosts(cat);
        if (posts && posts.length > 0) {
          container.innerHTML = posts.map(renderArticleCard).join('');
          return;
        }
      }
      
      // Fallback filtering on existing DOM cards
      const articleCards = document.querySelectorAll('.article-card');
      articleCards.forEach(card => {
        if (cat === 'all' || card.getAttribute('data-category') === cat) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }

    categoryPills.forEach((pill) => {
      pill.addEventListener('click', () => {
        categoryPills.forEach(p => {
          p.classList.remove('bg-neutral-950', 'text-white');
          p.classList.add('bg-surface-50', 'text-neutral-700');
        });
        pill.classList.remove('bg-surface-50', 'text-neutral-700');
        pill.classList.add('bg-neutral-950', 'text-white');

        const cat = pill.getAttribute('data-cat');
        updateArticles(cat);
      });
    });

    // Initial load from Sanity if configured
    if (window.sanityClient && window.sanityClient.isConfigured()) {
      updateArticles('all');
    }
  </script>
