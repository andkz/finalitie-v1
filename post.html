    // XSS Sanitizer helper
    function sanitize(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Helper to render Sanity Block Content (Portable Text) to HTML safely
    function renderPortableText(blocks) {
      if (!blocks || !Array.isArray(blocks)) {
        return '<p>No content available.</p>';
      }
      return blocks.map(block => {
        if (block._type !== 'block' || !block.children) return '';
        const text = block.children.map(child => {
          let t = sanitize(child.text || '');
          if (child.marks && child.marks.includes('strong')) t = `<strong>${t}</strong>`;
          if (child.marks && child.marks.includes('em')) t = `<em>${t}</em>`;
          return t;
        }).join('');

        if (block.style === 'h2') return `<h2>${text}</h2>`;
        if (block.style === 'h3') return `<h3>${text}</h3>`;
        if (block.style === 'blockquote') return `<blockquote>${text}</blockquote>`;
        return `<p>${text}</p>`;
      }).join('');
    }

    // Load Article Dynamically by ?slug=...
    async function loadArticle() {
      const params = new URLSearchParams(window.location.search);
      const rawSlug = params.get('slug') || 'seo-basics-every-business-owner-should-know';
      const slug = rawSlug.replace(/[^a-zA-Z0-9_-]/g, '');

      const post = await window.sanityClient.getPostBySlug(slug);

      if (!post) {
        document.getElementById('post-title').textContent = 'Article Not Found';
        document.getElementById('post-excerpt').textContent = 'The article you are looking for does not exist or has been removed.';
        return;
      }

      const safeTitle = post.title || 'Article';
      document.getElementById('page-title').textContent = `${safeTitle} · Finalitie Blog`;
      document.getElementById('post-title').textContent = safeTitle;
      document.getElementById('post-category').textContent = post.category || 'Articles';
      document.getElementById('post-date').textContent = formatSanityDate(post.publishedAt);
      document.getElementById('post-author').textContent = `by ${post.author || 'Kamil'}`;
      document.getElementById('post-excerpt').textContent = post.excerpt || '';

      const imgEl = document.getElementById('post-image');
      const safeImg = post.imageUrl || 'images/UX8TVZdzOAePEbH2W2z2Znd3tA.jpg';
      imgEl.src = safeImg;
      imgEl.alt = safeTitle;
      imgEl.style.display = 'block';

      const bodyEl = document.getElementById('post-body');
      if (post.content) {
        const paragraphs = post.content.split(/\n\s*\n/).map(p => {
          const trimmed = p.trim();
          if (trimmed.startsWith('### ')) return `<h3>${sanitize(trimmed.slice(4))}</h3>`;
          if (trimmed.startsWith('## ')) return `<h2>${sanitize(trimmed.slice(3))}</h2>`;
          if (trimmed.startsWith('# ')) return `<h1>${sanitize(trimmed.slice(2))}</h1>`;
          return `<p>${sanitize(trimmed)}</p>`;
        }).join('');
        bodyEl.innerHTML = paragraphs;
      } else if (post.body) {
        bodyEl.innerHTML = renderPortableText(post.body);
      } else {
        // Fallback demo body
        const safeExcerpt = sanitize(post.excerpt || '');
        bodyEl.innerHTML = `
          <h2>Understanding the Fundamentals</h2>
          <p>${safeExcerpt}</p>
          <p>When potential customers search for services in your industry, having a fast, well-structured, and professionally designed website ensures you get found before your competitors.</p>
          <h2>Why It Matters For Business Growth</h2>
          <p>Search engines prioritize websites that deliver exceptional user experience, instant loading speeds, and mobile-friendly responsive designs. By aligning your digital presence with best practices, you turn ordinary visitors into loyal clients.</p>
        `;
      }
    }

    loadArticle();
